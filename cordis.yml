# dsh-web-auth 插件 —— 用 --patch 把它插入 Web UI
#
# 用法（在 deepseek-harness 仓库根目录）：
#   pnpm dsh web --patch E:/DSH/dsh-web-auth/cordis.yml
- insert:
    - id: web-auth
      name: 'E:/DSH/dsh-web-auth/src/index.ts'
      config:
        tokenMode: auto
        rejectStatus: 401
        allowNetworkExposure: false
